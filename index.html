document.addEventListener('click', async e=>{
  if(e.target.matches('[data-overlay]')){ dismissModal(); return; }
  const t = e.target.closest('[data-go],[data-action],[data-close],[data-day],[data-edit],[data-pick],[data-rem-edit],[data-rem-done],[data-limit],[data-catkind],[data-plantab],[data-pal-pick]');
  if(!t || t.closest('#movForm,#remForm,#limForm') && !t.matches('[data-close]')) return;
  if(t.dataset.close!==undefined){ dismissModal(); return; }
  if(t.dataset.go){ closeModal(); go(t.dataset.go); return; }
  if(t.dataset.day){ openDay(t.dataset.day); return; }
  if(t.dataset.edit){ const m=state.movements.find(x=>x.id===t.dataset.edit); if(m) movementForm(m); return; }
  if(t.dataset.pick){ const d=ui.addDate; ui.addDate=null; movementForm(null,{kind:t.dataset.pick, date:d||undefined}); return; }
  if(t.dataset.remEdit){ const r=state.reminders.find(x=>x.id===t.dataset.remEdit); if(r) reminderForm(r); return; }
  if(t.dataset.remDone){ const r=state.reminders.find(x=>x.id===t.dataset.remDone); if(!r) return;
    const k=r.kind==='cobro'?'in':'out'; const match=catsOf(k).find(c=>c.name.toLowerCase()===r.name.toLowerCase());
    movementForm(null,{kind:k, amount:r.amount, desc:r.name, date:todayStr(), categoryId:match?.id, reminderId:r.id}); return; }
  if(t.dataset.limit){ limitForm(t.dataset.limit); return; }
  if(t.dataset.catkind){ ui.catKind=t.dataset.catkind; render(); return; }
  if(t.dataset.plantab){ ui.planTab=t.dataset.plantab; render(); return; }
  if(t.dataset.palPick){ setPal(t.dataset.palPick); render(); toast('Colores: '+(t.dataset.palPick==='auto'?'Automático':PALETTES[t.dataset.palPick].label)); return; }
  const a=t.dataset.action, id=t.dataset.id;
  switch(a){
    case 'add': chooseKind(t.dataset.date); break;
    case 'add-kind': movementForm(null,{kind:t.dataset.kind}); break;
    case 'rem-new': reminderForm(null,{due:t.dataset.date, kind:t.dataset.kind}); break;
    case 'cats': ui.catKind=t.dataset.kind||'out'; go('ajustes'); break;
    case 'dismiss-notice': state.notice=''; save(); render(); break;
    case 'dismiss-sample': state.sample=false; save(); render(); break;
    case 'load-sample': if(state.movements.length && !(await askConfirm('Se reemplazan tus datos por un ejemplo. Exportá una copia antes si querés guardar lo tuyo.','Cargar ejemplo'))) break;
      { const keep=state.profile; state=sampleState(); state.profile=keep; } ui.month=ymOf(todayStr()); save(); go('inicio'); toast('Ejemplo cargado'); break;
    case 'clear-all': if(await askConfirm('Se borran todos tus movimientos, pagos y cobros. Las categorías vuelven a las de siempre. No se puede deshacer.','Borrar todo')){ const keep=state.profile; state=emptyState(); state.profile=keep; save(); go('inicio'); toast('Listo, empezás de cero'); } break;
    case 'toggle-cat': { const c=cat(id); if(c){ c.hidden=!c.hidden; save(); render(); } break; }
    case 'del-cat': { const c=cat(id); if(!c) break; const n=state.movements.filter(m=>m.categoryId===id).length;
      const fb = catsOf(c.kind).find(x=>x.id!==id && /^otr/i.test(x.name)) || catsOf(c.kind).find(x=>x.id!==id);
      if(await askConfirm(n?`“${esc(c.name)}” tiene ${n} movimiento${n>1?'s':''}. ${n>1?'Pasan':'Pasa'} a “${esc(fb?fb.name:'Sin categoría')}”.`:`Se borra “${esc(c.name)}”.`,'Borrar')){
        state.movements.forEach(m=>{ if(m.categoryId===id) m.categoryId=fb?fb.id:null; }); state.categories=state.categories.filter(x=>x.id!==id); save(); render(); toast('Categoría borrada'); } break; }
    case 'export-json': offerFile(`libro-de-caja-${todayStr()}.json`, JSON.stringify(state,null,2), 'application/json'); break;
    case 'export-csv': offerFile(`movimientos-${todayStr()}.csv`, toCSV(), 'text/csv'); break;
    case 'copy-export': { const ta=$('#exportText'); try{ await navigator.clipboard.writeText(ta.value); toast('Copiado'); }catch(err){ ta.focus(); ta.select(); toast('Texto seleccionado: copialo'); } break; }
    case 'import-paste': $('#exportOut').innerHTML=`<div class="field"><label for="pasteText">Pegá acá la copia</label><textarea class="export" id="pasteText"></textarea><button class="btn sm primary" data-action="import-paste-go" style="align-self:flex-start">Importar</button></div>`; $('#pasteText').focus(); break;
    case 'import-paste-go': importText($('#pasteText').value); break;
    case 'install': if(deferredInstall){ deferredInstall.prompt(); try{ await deferredInstall.userChoice; }catch(err){} deferredInstall=null; render(); } break;
    case 'lock-now': showLock(); break;
    case 'fx-refresh': { t.disabled=true; const ok=await fetchFx(); render(); toast(ok?'Dólar actualizado':'No pude consultar el dólar ahora. Cargalo a mano.'); break; }
    case 'del-area': { const a=state.areas.find(x=>x.id===id); if(!a) break;
      if(await askConfirm(`Se borra el área “${esc(a.name)}”. Sus categorías quedan sin área.`,'Borrar')){ state.categories.forEach(c=>{ if(c.areaId===id) c.areaId=null; }); state.areas=state.areas.filter(x=>x.id!==id); save(); render(); } break; }
    case 'pin-remove': if(await askConfirm('La app va a abrir sin PIN.','Quitar PIN')){ try{ localStorage.removeItem(PIN_KEY); }catch(err){} render(); toast('PIN quitado'); } break;
    case 'pin-forgot': { const b=$('#unlockForm'); if(b) b.innerHTML=`<h2>¿Olvidaste el PIN?</h2><p style="opacity:.9">No se puede recuperar. La única salida es borrar los datos de la app en este dispositivo. Si tenés una copia exportada, después la importás.</p><button type="button" data-action="pin-wipe" style="background:var(--out-soft);color:var(--out)">Borrar todo y quitar PIN</button><button type="button" class="link" data-action="pin-back">Volver</button>`; break; }
    case 'pin-back': showLock(); break;
    case 'pin-wipe': try{ localStorage.removeItem(PIN_KEY); }catch(err){} state=emptyState(); save(); hideLock(); toast('Datos borrados'); break;
  }
});
document.addEventListener('change', e=>{
  const el=e.target;
  if(el.id==='importFile' && el.files && el.files[0]){ const fr=new FileReader(); fr.onload=()=>importText(String(fr.result)); fr.onerror=()=>toast('No se pudo leer el archivo.'); fr.readAsText(el.files[0]); el.value=''; return; }
  if(el.dataset.rename){ const c=cat(el.dataset.rename), v=el.value.trim(); if(!c) return; if(!v){ el.value=c.name; return; } c.name=v.slice(0,60); save(); toast('Nombre cambiado'); }
  if(el.dataset.catArea){ const c=cat(el.dataset.catArea); if(!c) return; c.areaId=el.value||null; save(); if(ui.view==='plan') render(); toast('Listo'); }
  if(el.dataset.areaName){ const a=state.areas.find(x=>x.id===el.dataset.areaName), v=el.value.trim(); if(!a) return; if(!v){ el.value=a.name; return; } a.name=v.slice(0,50); save(); setTimeout(render); }
  if(el.dataset.areaPct){ const a=state.areas.find(x=>x.id===el.dataset.areaPct); if(!a) return; const raw=el.value.trim().replace('%','').replace(',','.');
    if(!raw){ a.pct=null; save(); setTimeout(render); return; }
    const v=Number(raw); if(!(v>=0 && v<=100)){ toast('Usá un porcentaje entre 0 y 100.'); render(); return; }
    a.pct=Math.round(v*100)/100; save(); setTimeout(render); }
});
document.addEventListener('submit', async e=>{
  const f=e.target;
  if(f.id==='catForm'){ e.preventDefault(); const name=$('#cat-name').value.trim(), k=ui.catKind; $('#catErr').textContent='';
    if(!name){ $('#catErr').textContent='Escribí un nombre.'; return; }
    if(catsOf(k).some(x=>x.name.toLowerCase()===name.toLowerCase())){ $('#catErr').textContent='Ya existe una con ese nombre.'; return; }
    const nid='c-'+uid(); state.categories.push({id:nid, kind:k, name:name.slice(0,60), hidden:false, limit:null, areaId:defaultAreaFor({id:nid,kind:k})}); save(); render(); toast('Categoría creada'); }
  if(f.id==='goalForm'){ e.preventDefault(); const raw=$('#goal-amt').value.trim(); $('#goalErr').textContent='';
    if(!raw){ state.plan.goal=null; save(); render(); toast('Meta quitada'); return; }
    const v=parseAmount(raw); if(!(v>0)){ $('#goalErr').textContent='Escribí un número, por ejemplo 10000 o 10.000.'; return; }
    state.plan={goal:v, cur:$('#goal-cur').value==='ARS'?'ARS':'USD'}; save(); render(); toast('Meta guardada'); }
  if(f.id==='fxForm'){ e.preventDefault(); $('#fxErr').textContent='';
    const parts=[]; let bad=false;
    WALLETS.forEach(([n],i)=>{ const rb=$('#fxb-'+i).value.trim(), ra=$('#fxa-'+i).value.trim(); if(!rb && !ra) return;
      const b=parseAmount(rb||ra), a=parseAmount(ra||rb); if(b>0 && a>0) parts.push({name:n, bid:b/100, ask:a/100, mid:avg([b/100,a/100])}); else bad=true; });
    if(bad || !parts.length){ $('#fxErr').textContent='Escribí la compra y la venta de al menos una billetera, por ejemplo 1400 y 1500.'; return; }
    state.fx={rate:avg(parts.map(p=>p.mid)), updatedAt:Date.now(), source:'manual', parts}; save(); render(); toast('Dólar guardado: '+moneyFmt.format(state.fx.rate)); }
  if(f.id==='areaForm'){ e.preventDefault(); const name=$('#area-new').value.trim(); if(!name) return;
    if(state.areas.some(a=>a.name.toLowerCase()===name.toLowerCase())){ toast('Ya existe un área con ese nombre'); return; }
    state.areas.push({id:'ar-'+uid(), name:name.slice(0,50), pct:null}); save(); render(); toast('Área agregada. Elegí qué categorías entran en ella.'); }
  if(f.id==='nameForm'){ e.preventDefault(); state.profile.name=$('#name-in').value.trim().slice(0,40); save(); render(); toast(state.profile.name?'Hola, '+state.profile.name:'Nombre borrado'); return; }
  if(f.id==='pinForm'){ e.preventDefault(); const p1=$('#pin1').value, p2=$('#pin2').value;
    if(!/^\d{4,8}$/.test(p1)){ $('#pinErr').textContent='Usá entre 4 y 8 números.'; return; }
    if(p1!==p2){ $('#pinErr').textContent='No coinciden.'; return; }
    const salt=uid()+uid(); try{ localStorage.setItem(PIN_KEY, JSON.stringify({salt, hash:await hashPin(p1,salt)})); render(); toast('PIN activado'); }catch(err){ $('#pinErr').textContent='No se pudo guardar el PIN.'; } }
  if(f.id==='unlockForm'){ e.preventDefault(); const p=getPin(); if(!p){ hideLock(); return; }
    if(await hashPin($('#unlockPin').value,p.salt)===p.hash){ wrongTries=0; hideLock(); }
    else { wrongTries++; $('#unlockErr').textContent = wrongTries>=3?'PIN incorrecto. Si no lo recordás, tocá “Olvidé mi PIN”.':'PIN incorrecto.'; $('#unlockPin').value=''; } }
});
