<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0B0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Libro de Caja">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Libro de Caja</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Layout: app de una columna (máx. 720px), encabezado con mes, barra de navegación abajo en el celular y arriba en pantallas anchas */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#E6EBF1; --ink:#0E1726; --muted:#5A6474; --line:#DCE2EA;
  --brand:#14213D; --brand-ink:#FFFFFF; --brand-text:#14213D; --brand-soft:#E3E8F2;
  --in:#0F7B57; --in-fill:#3DAE7F; --in-soft:#E0F3EC;
  --out:#C93B3B; --out-fill:#D9534F; --out-soft:#FBE4E4;
  --plan-bg:#FFFFFF; --plan-line:#8E99AB; --plan-ink:#0E1726; --fab:#F5B544; --fab-ink:#14213D;
  --shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.08); color-scheme:light;
  --f-display:"Sora","DM Sans",system-ui,sans-serif;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
/* Automático: Marino de día, Noche si el teléfono está en modo oscuro */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0B0C; --surface:#161618; --surface-2:#222225; --ink:#F4F4F1; --muted:#A2A29D; --line:#2B2B2F;
  --brand:#F4F4F1; --brand-ink:#0B0B0C; --brand-text:#F4F4F1; --brand-soft:#2A2A2E;
  --in:#5BD69C; --in-fill:#3FBF84; --in-soft:#16301F;
  --out:#FF7B6C; --out-fill:#E5574A; --out-soft:#3A1E1B;
  --plan-bg:transparent; --plan-line:#F4F4F1; --plan-ink:#F4F4F1; --fab:#F4F4F1; --fab-ink:#0B0B0C;
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B0B0C; --surface:#161618; --surface-2:#222225; --ink:#F4F4F1; --muted:#A2A29D; --line:#2B2B2F;
  --brand:#F4F4F1; --brand-ink:#0B0B0C; --brand-text:#F4F4F1; --brand-soft:#2A2A2E;
  --in:#5BD69C; --in-fill:#3FBF84; --in-soft:#16301F;
  --out:#FF7B6C; --out-fill:#E5574A; --out-soft:#3A1E1B;
  --plan-bg:transparent; --plan-line:#F4F4F1; --plan-ink:#F4F4F1; --fab:#F4F4F1; --fab-ink:#0B0B0C;
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark;
}
/* Paletas elegidas a mano en Ajustes → Colores (le ganan al modo del teléfono) */
:root[data-pal][data-pal="marino"]{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#E6EBF1; --ink:#0E1726; --muted:#5A6474; --line:#DCE2EA;
  --brand:#14213D; --brand-ink:#FFFFFF; --brand-text:#14213D; --brand-soft:#E3E8F2;
  --in:#0F7B57; --in-fill:#3DAE7F; --in-soft:#E0F3EC;
  --out:#C93B3B; --out-fill:#D9534F; --out-soft:#FBE4E4;
  --plan-bg:#FFFFFF; --plan-line:#8E99AB; --plan-ink:#0E1726; --fab:#F5B544; --fab-ink:#14213D;
  --shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.08); color-scheme:light;
}
:root[data-pal][data-pal="negro"]{
  --bg:#F3F3F1; --surface:#FFFFFF; --surface-2:#EAEAE6; --ink:#0F0F0F; --muted:#62625E; --line:#E0E0DB;
  --brand:#111111; --brand-ink:#FFFFFF; --brand-text:#111111; --brand-soft:#EAEAE6;
  --in:#17804F; --in-fill:#3FAE76; --in-soft:#E2F2E9;
  --out:#C3382A; --out-fill:#D24B3D; --out-soft:#FBE5E1;
  --plan-bg:#FFFFFF; --plan-line:#A6A6A0; --plan-ink:#0F0F0F; --fab:#111111; --fab-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.08); color-scheme:light;
}
:root[data-pal][data-pal="noche"]{
  --bg:#0B0B0C; --surface:#161618; --surface-2:#222225; --ink:#F4F4F1; --muted:#A2A29D; --line:#2B2B2F;
  --brand:#F4F4F1; --brand-ink:#0B0B0C; --brand-text:#F4F4F1; --brand-soft:#2A2A2E;
  --in:#5BD69C; --in-fill:#3FBF84; --in-soft:#16301F;
  --out:#FF7B6C; --out-fill:#E5574A; --out-soft:#3A1E1B;
  --plan-bg:transparent; --plan-line:#F4F4F1; --plan-ink:#F4F4F1; --fab:#F4F4F1; --fab-ink:#0B0B0C;
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
.app{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
h2{font-size:1.1rem;font-weight:600}
h3{font-size:.95rem;font-weight:600}
p{margin:0}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand-text);outline-offset:2px}
a{color:var(--brand-text)}
.c-in{color:var(--in)} .c-out{color:var(--out)} .c-inv{color:var(--brand-text)}

/* Encabezado */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:14px 10px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;flex:none}
.brand h1{font-size:1.1rem;font-weight:700;white-space:nowrap}
.top-actions{display:flex;align-items:center;gap:4px}
.icon-btn{border:0;background:transparent;width:38px;height:38px;border-radius:999px;cursor:pointer;color:var(--ink);display:grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px}
.month{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:14px}
.month strong{font-family:var(--f-display);font-weight:600;font-size:1.25rem}
.month .arrows{display:flex;gap:4px;align-items:center}
.pill-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.8rem;font-weight:600}

/* Navegación */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);align-items:end;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;cursor:pointer;color:var(--muted);font-size:.7rem;font-weight:600}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--brand-text)}
.nav .add{color:var(--brand-text)}
.nav .add span.plus{width:52px;height:52px;border-radius:50%;background:var(--fab);color:var(--fab-ink);display:grid;place-items:center;font-size:1.9rem;line-height:1;margin-top:-22px;box-shadow:0 6px 16px rgba(0,0,0,.22)}
@media (min-width:900px){
  body{padding-bottom:40px}
  .nav{position:sticky;top:0;bottom:auto;border:1px solid var(--line);border-radius:var(--r);max-width:720px;margin:0 auto 16px;padding:6px;grid-template-columns:repeat(5,1fr);align-items:center}
  .nav button{flex-direction:row;justify-content:center;font-size:.85rem;padding:8px 0;gap:6px}
  .nav .add span.plus{width:30px;height:30px;font-size:1.3rem;margin:0;box-shadow:none}
}

/* Bloques */
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;display:flex;flex-direction:column;gap:10px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.link-btn{border:0;background:none;color:var(--brand-text);font-weight:600;cursor:pointer;font-size:.85rem;padding:0}
.hero{background:var(--brand);color:var(--brand-ink);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:6px}
.hero .label{color:var(--brand-ink);opacity:.8}
.hero .big{font-family:var(--f-display);font-size:2.3rem;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.hero .sub{opacity:.85;font-size:.9rem}
.hero details summary{cursor:pointer;font-size:.85rem;font-weight:600;opacity:.9;margin-top:4px}
.hero .formula{background:rgba(127,127,127,.14);margin-top:8px}
.hero .formula .f-row{border-color:rgba(127,127,127,.3)}

.stackbar{display:flex;height:16px;border-radius:5px;overflow:hidden;background:var(--surface-2)}
.stackbar i{display:block;height:100%}
.sb-out{background:var(--out-fill)} .sb-inv{background:var(--brand)} .sb-save{background:var(--plan-bg);box-shadow:inset 0 0 0 1px var(--plan-line)} .sb-free{background:var(--in-fill)}
.legend{display:flex;flex-direction:column}
.lg{display:grid;grid-template-columns:14px 1fr auto auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:.92rem}
.lg:first-child{border-top:0}
.sw{width:12px;height:12px;border-radius:3px}
.lg .pc{color:var(--muted);font-size:.8rem;min-width:4.2em;text-align:right}

.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.mini .v{font-family:var(--f-display);font-weight:600;font-size:1.05rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

/* Filas tocables */
.list{display:flex;flex-direction:column}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.list > .mrow:first-child,.list > .prow:first-child{border-top:0}
.mrow:hover .t{color:var(--brand-text)}
.mi{display:flex;flex-direction:column;min-width:0}
.mi .t{font-weight:500;overflow-wrap:anywhere}
.mi .s{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.ma{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.tag{display:inline-block;font-size:.68rem;font-weight:700;padding:1px 7px;border-radius:999px;margin-left:4px;vertical-align:1px}
.tag.save{background:var(--plan-bg);color:var(--plan-ink);border:1px solid var(--plan-line)}
.tag.inv{background:var(--brand);color:var(--brand-ink)}
.tag.red{background:var(--out-soft);color:var(--out)}
.tag.grey{background:var(--surface-2);color:var(--muted)}

.catrow{display:flex;flex-direction:column;gap:5px;padding:9px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.catrow:first-child{border-top:0}
.catrow .line{display:flex;justify-content:space-between;gap:8px;font-size:.92rem}
.catrow .line span:first-child{min-width:0;overflow-wrap:anywhere}
.track{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.fill{height:100%;border-radius:4px;background:var(--out-fill)}
.fill.over{background:var(--out)}

.prow{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.prow .mrow{border:0;padding:0}
.prow .act{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.danger{color:var(--out)}
.btn.sm{padding:5px 11px;font-size:.8rem;border-radius:8px}
.btn.block{width:100%}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.notice{padding:12px 14px;border-radius:var(--r);background:var(--surface-2);font-size:.88rem;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.notice .grow{flex:1 1 220px;min-width:0}
.notice.risk{background:var(--out-soft)}
.notice.risk strong{color:var(--out)}
.empty{padding:18px 6px;text-align:center;color:var(--muted);font-size:.9rem}

/* Formularios */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > label,.flabel{font-size:.8rem;font-weight:600;color:var(--muted)}
.field input,.field select{padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);width:100%;min-width:0;font-size:16px}
.field input.big{font-family:var(--f-display);font-size:1.8rem;font-weight:700;padding:8px 12px}
.err{color:var(--out);font-size:.8rem}
.err:empty{display:none}
.hint{font-size:.78rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.86rem;font-weight:600;color:var(--ink)}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip:has(input:checked),.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chip:has(input:focus-visible){outline:2px solid var(--brand-text);outline-offset:2px}
.chip.add{border-style:dashed;color:var(--brand-text)}
.inline-new{display:flex;gap:6px}
.inline-new input{flex:1;min-width:0;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
.seg4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface-2);padding:3px;border-radius:10px}
.seg4 label{text-align:center;padding:7px 2px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.82rem;color:var(--muted);position:relative}
.seg4 input{position:absolute;opacity:0;pointer-events:none}
.seg4 label:has(input:checked){background:var(--surface);box-shadow:var(--shadow);color:var(--ink)}
.seg4 label:has(input:focus-visible){outline:2px solid var(--brand-text)}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--brand)}
details.more summary{cursor:pointer;font-weight:600;font-size:.88rem;color:var(--brand-text)}
details.more[open] summary{margin-bottom:10px}

/* Elegir tipo */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;background:var(--surface);display:flex;flex-direction:column;gap:4px;min-height:112px}
.tile b{font-family:var(--f-display);font-size:1.2rem}
.tile span{font-size:.82rem;color:var(--muted)}
.tile.t-in b{color:var(--in)} .tile.t-out b{color:var(--out)}
.tile.t-save{background:var(--plan-bg);border-color:var(--plan-line)} .tile.t-save b,.tile.t-save span{color:var(--plan-ink)}
.tile.t-inv{background:var(--brand);border-color:var(--brand)} .tile.t-inv b,.tile.t-inv span{color:var(--brand-ink)}
.tile:hover{filter:brightness(.97)}

/* Calendario */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-wd{font-size:.68rem;text-align:center;color:var(--muted);font-weight:600;text-transform:uppercase}
.cal-cell{min-height:62px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 5px;display:flex;flex-direction:column;gap:0;cursor:pointer;text-align:left;font-size:.7rem;line-height:1.3;min-width:0;overflow:hidden;font-variant-numeric:tabular-nums}
.cal-cell:hover{background:var(--surface-2)}
.cal-cell.blank{border:0;background:transparent;cursor:default}
.cal-cell .d{font-weight:600;font-size:.78rem;color:var(--muted)}
.cal-cell.has .d{color:var(--ink)}
.cal-cell.today{border-color:var(--brand-text);box-shadow:inset 0 0 0 1px var(--brand-text)}
.cal-cell .ci{color:var(--in);font-weight:700;white-space:nowrap}
.cal-cell .co{color:var(--out);font-weight:700;white-space:nowrap}
.dots{display:flex;gap:3px;margin-top:auto;padding-top:2px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.inv{background:var(--brand)} .dot.save{background:var(--plan-bg);border:1px solid var(--plan-line)} .dot.pago{border:2px solid var(--out)} .dot.cobro{border:2px solid var(--in)}
.keys{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.75rem;color:var(--muted)}
.keys span{display:inline-flex;gap:5px;align-items:center}
@media (min-width:700px){.cal-cell{min-height:80px;font-size:.78rem;padding:6px}}
.daygroup{display:flex;flex-direction:column}
.dayhead{border:0;background:none;padding:12px 0 2px;text-align:left;font-weight:700;font-size:.85rem;color:var(--muted);cursor:pointer;display:flex;justify-content:space-between}
.dayhead:hover{color:var(--brand-text)}

/* Hoja */
.overlay{position:fixed;inset:0;background:rgba(8,12,10,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:16px;padding:22px}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.88rem;z-index:60;max-width:calc(100% - 32px)}

/* Guía */
.guide h2{font-size:1.3rem}
.guide h3{font-size:1.05rem;margin-bottom:2px}
.guide p,.guide li{max-width:62ch}
.guide ol,.guide ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.formula{border-radius:10px;background:var(--surface-2);padding:6px 12px;display:flex;flex-direction:column}
.f-row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:.92rem}
.f-row:first-child{border-top:0}
.f-row b{font-variant-numeric:tabular-nums;white-space:nowrap}
.f-row.total{border-top:2px solid currentColor;font-weight:700}
.screens{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:8px}
.screens div{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:.88rem}
.screens b{display:block;font-family:var(--f-display)}
.welcome{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px}
.welcome h2{font-size:1.35rem}
.steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}

textarea.export{width:100%;min-height:140px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.cat-edit{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.cat-edit:first-child{border-top:0}
.cat-edit input{flex:1 1 150px;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px}
.cat-edit.is-hidden input{opacity:.55}
.privacy{margin-top:24px;font-size:.78rem;color:var(--muted);text-align:center}

/* Colores */
.pals{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px}
.pal{border:1px solid var(--line);border-radius:14px;padding:8px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:8px;text-align:left;color:var(--ink)}
.pal[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pal-prev{border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;height:84px;border:1px solid rgba(127,127,127,.25)}
.pal-hero{border-radius:7px;height:30px;display:flex;align-items:center;padding:0 8px;font-family:var(--f-display);font-weight:700;font-size:.85rem}
.pal-dots{display:flex;gap:5px;align-items:center}
.pal-dots i{width:12px;height:12px;border-radius:50%;display:block}
.pal-name{font-weight:700;font-size:.9rem;display:flex;justify-content:space-between;align-items:center;gap:6px}
.pal-name small{font-weight:500;color:var(--muted);font-size:.75rem}
/* Plan */
.segbtns{display:flex;gap:6px;flex-wrap:wrap}
.pctbox{display:inline-flex;align-items:center;gap:4px;font-weight:700}
.cat-edit .pctbox input{flex:none;width:4.6em;text-align:right;font-variant-numeric:tabular-nums}
.areasel{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);max-width:100%;font-size:15px}
.area-cmp{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.area-cmp:first-child{border-top:0}
.area-cmp .line{display:flex;justify-content:space-between;align-items:center;gap:8px}
.area-cmp .cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.area-cmp .cols div{display:flex;flex-direction:column;min-width:0}
.area-cmp .cols b{font-size:.95rem;overflow-wrap:anywhere;white-space:normal}
.fill.ideal{background:var(--brand)}
.chip.sm{padding:3px 10px;font-size:.8rem}
.fx-table td,.fx-table th{padding:7px 4px}
.fx-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:end}
.fx-row .flabel{align-self:center}

/* Bloqueo */
.lock{position:fixed;inset:0;z-index:80;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;
  padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lock-box{width:100%;max-width:320px;display:flex;flex-direction:column;gap:14px;text-align:center}
.lock-box h2{font-size:1.5rem}
.lock-box input{text-align:center;font-size:1.6rem;letter-spacing:.4em;padding:12px;border-radius:10px;border:0;background:rgba(127,127,127,.22);color:var(--brand-ink);width:100%}
.lock-box input::placeholder{color:var(--brand-ink);opacity:.55;letter-spacing:.1em;font-size:1rem}
.lock-box .err{color:var(--brand-ink);font-size:.88rem;min-height:1.2em}
.lock-box button{border:0;border-radius:10px;padding:12px;font-weight:700;cursor:pointer;background:var(--brand-ink);color:var(--brand)}
.lock-box .link{background:none;color:var(--brand-ink);opacity:.85;font-weight:500;text-decoration:underline;padding:4px}
</style>

  <div class="month" id="monthBar">
    <strong id="monthLabel">—</strong>

      <button class="icon-btn" id="prevMonth" aria-label="Mes anterior">‹</button>

<script>
(function(){
'use strict';
/* ---------- Utilidades ---------- */
const KEY = 'libro-de-caja-v3';
const OLD_KEY = 'libro-de-caja-v1';
const PIN_KEY = 'libro-de-caja-pin';
const $ = (s, r=document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const moneyFmt = new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',minimumFractionDigits:0,maximumFractionDigits:2});
const money = c => moneyFmt.format((c||0)/100);
const pctNum = v => v.toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2}) + '%';
const pctOf = (c, base) => base > 0 ? pctNum(c/base*100) : '—';
const amountToInput = c => (c/100).toLocaleString('es-AR',{maximumFractionDigits:2});
const sum = arr => arr.reduce((a,m)=>a+m.amount,0);
function compact(c){ const v=c/100;
  if(v>=1e6) return (v/1e6).toLocaleString('es-AR',{maximumFractionDigits:1})+'M';
  if(v>=1e4) return Math.round(v/1e3)+'k';
  if(v>=1e3) return (v/1e3).toLocaleString('es-AR',{maximumFractionDigits:1})+'k';
  return String(Math.round(v)); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function yesterdayStr(){ const d=new Date(); d.setDate(d.getDate()-1); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
const ymOf = d => d.slice(0,7);
function addMonths(ym, n){ let [y,m]=ym.split('-').map(Number); m+=n; while(m>12){m-=12;y++} while(m<1){m+=12;y--} return y+'-'+pad(m); }
function daysInMonth(ym){ const [y,m]=ym.split('-').map(Number); return new Date(y,m,0).getDate(); }
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
function monthName(ym){ const [y,m]=ym.split('-').map(Number); return cap(new Date(y,m-1,1).toLocaleDateString('es-AR',{month:'long',year:'numeric'})); }
function longDate(d){ const [y,m,dd]=d.split('-').map(Number); return cap(new Date(y,m-1,dd).toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})); }
function shortDate(d){ const [,m,dd]=d.split('-'); return dd+'/'+m; }
function isValidDate(s){ if(!/^\d{4}-\d{2}-\d{2}$/.test(s||'')) return false; const [y,m,d]=s.split('-').map(Number); const dt=new Date(y,m-1,d); return dt.getFullYear()===y && dt.getMonth()===m-1 && dt.getDate()===d && y>1900 && y<2200; }
function daysUntil(d){ const [y,m,dd]=d.split('-').map(Number); const t=new Date(); const a=new Date(t.getFullYear(),t.getMonth(),t.getDate()); return Math.round((new Date(y,m-1,dd)-a)/86400000); }
function parseAmount(raw){
  let s=String(raw??'').trim().replace(/[\s$]/g,'');
  if(!s) return NaN;
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  if(!/^\d+(\.\d{1,2})?$/.test(s)) return NaN;
  return Math.round(parseFloat(s)*100);
}

/* Los cuatro tipos de movimiento */
const KINDS = {
  in:     {tile:'Entró plata', short:'Entró', hint:'Sueldo, una venta, un cobro', title:'Entró plata', descLabel:'¿De dónde vino? (opcional)', sign:'+ ', cls:'c-in', group:'Entradas'},
  out:    {tile:'Gasté', short:'Gasté', hint:'Algo que ya pagaste', title:'Gasté', descLabel:'¿En qué? (opcional)', sign:'− ', cls:'c-out', group:'Gastos'},
  save:   {tile:'Aparté', short:'Aparté', hint:'Plata que separás para algo y todavía no usaste', title:'Aparté plata', descLabel:'¿Para qué? (opcional)', sign:'', cls:'', group:'Para qué apartás'},
  invest: {tile:'Invertí', short:'Invertí', hint:'Plata que pusiste en un plazo fijo, acciones, un emprendimiento…', title:'Invertí', descLabel:'Detalle (opcional)', sign:'', cls:'c-inv', group:'Tipos de inversión'},
};
const KIND_ORDER = ['in','out','save','invest'];

/* ---------- Colores de la app ----------
   Seis paletas fijas con la misma tipografía. La elección se guarda en este dispositivo.
   "auto" sigue el modo del teléfono: Marino de día, Noche de noche. */
const PALETTES = {"marino": {"label": "Marino", "dark": false, "bg": "#EEF1F5", "surface": "#FFFFFF", "ink": "#0E1726", "brand": "#14213D", "brandInk": "#FFFFFF", "inn": "#0F7B57", "out": "#C93B3B", "fab": "#F5B544", "line": "#DCE2EA"}, "negro": {"label": "Negro", "dark": false, "bg": "#F3F3F1", "surface": "#FFFFFF", "ink": "#0F0F0F", "brand": "#111111", "brandInk": "#FFFFFF", "inn": "#17804F", "out": "#C3382A", "fab": "#111111", "line": "#E0E0DB"}, "noche": {"label": "Noche", "dark": true, "bg": "#0B0B0C", "surface": "#161618", "ink": "#F4F4F1", "brand": "#F4F4F1", "brandInk": "#0B0B0C", "inn": "#5BD69C", "out": "#FF7B6C", "fab": "#F4F4F1", "line": "#2B2B2F"}};
const PAL_KEY = 'libro-de-caja-colores';
function getPal(){ try{ const v=localStorage.getItem(PAL_KEY); return v && (v==='auto' || PALETTES[v]) ? v : 'auto'; }catch(e){ return 'auto'; } }
function applyPal(v){
  const root=document.documentElement;
  if(v && v!=='auto') root.setAttribute('data-pal', v); else root.removeAttribute('data-pal');
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta){ const dark = v==='auto' ? matchMedia('(prefers-color-scheme: dark)').matches : PALETTES[v].dark; meta.setAttribute('content', v==='auto' ? (dark?PALETTES.noche.bg:PALETTES.marino.brand) : (PALETTES[v].dark?PALETTES[v].bg:PALETTES[v].brand)); }
}
function setPal(v){ try{ localStorage.setItem(PAL_KEY, v); }catch(e){} applyPal(v); }
applyPal(getPal());


/* ---------- Datos ---------- */
/* Áreas del plan ideal: cada categoría de gasto, apartado o inversión cae en una */
function defaultAreas(){ return [
  {id:'ar-fijos', name:'Gastos fijos', pct:null},
  {id:'ar-dia', name:'Gastos del día a día', pct:null},
  {id:'ar-formacion', name:'Educación y formación', pct:null},
  {id:'ar-ahorro', name:'Ahorro', pct:null},
  {id:'ar-reinversion', name:'Reinversión', pct:null},
]; }
const DEFAULT_AREA = {'g-vivienda':'ar-fijos','g-servicios':'ar-fijos','g-deudas':'ar-fijos','g-comida':'ar-dia','g-transporte':'ar-dia','g-salud':'ar-dia','g-ocio':'ar-dia','g-otros':'ar-dia',
  'g-mc':'ar-formacion','g-formacion':'ar-formacion','s-colchon':'ar-ahorro','s-metas':'ar-ahorro','s-otros':'ar-ahorro','s-reinvertir':'ar-reinversion'};
function defaultAreaFor(c){ if(c.kind==='in') return null; if(DEFAULT_AREA[c.id]) return DEFAULT_AREA[c.id]; if(c.kind==='invest') return 'ar-reinversion'; if(c.kind==='save') return 'ar-ahorro'; return null; }
function defaultCategories(){
  const mk=(id,kind,name)=>({id,kind,name,hidden:false,limit:null});
  const list = [
    mk('in-principal','in','Sueldo / ingreso principal'), mk('in-cafe','in','Ingresos extra'), mk('in-inversiones','in','Rendimientos de inversiones'), mk('in-otros','in','Otros ingresos'),
    mk('g-vivienda','out','Vivienda'), mk('g-comida','out','Comida'), mk('g-transporte','out','Transporte'), mk('g-salud','out','Salud'),
    mk('g-servicios','out','Servicios'), mk('g-deudas','out','Deudas'), mk('g-formacion','out','Educación y formación'), mk('g-ocio','out','Ocio'), mk('g-otros','out','Otros gastos'),
    mk('s-reinvertir','save','Para reinvertir'), mk('s-colchon','save','Colchón de seguridad'), mk('s-metas','save','Metas'), mk('s-otros','save','Otros objetivos'),
    mk('i-trading','invest','Acciones, cripto o trading'), mk('i-plazo','invest','Plazo fijo / cuenta remunerada'), mk('i-cafe','invest','Emprendimiento propio'), mk('i-otra','invest','Otra inversión'),
  ];
  list.forEach(c=>c.areaId=defaultAreaFor(c));
  return list;
}
const emptyState = () => ({version:3, sample:false, profile:{name:'', from:''}, categories:defaultCategories(), movements:[], reminders:[], notice:'', areas:defaultAreas(), plan:{goal:null, cur:'USD'}, fx:{rate:null, updatedAt:0, source:'', parts:[]}});
function sampleState(){
  const ym=ymOf(todayStr()), next=addMonths(ym,1);
  const s=emptyState(); s.sample=true;
  s.movements=[
    {id:uid(),kind:'in',amount:30000000,date:ym+'-01',categoryId:'in-principal',desc:'Ingreso mensual base',entity:'',maturity:'',closed:false},
    {id:uid(),kind:'out',amount:23000000,date:ym+'-05',categoryId:'g-vivienda',desc:'Alquiler y expensas',entity:'',maturity:'',closed:false},
    {id:uid(),kind:'save',amount:7000000,date:ym+'-05',categoryId:'s-reinvertir',desc:'Remanente del mes',entity:'',maturity:'',closed:false},
  ];
  s.reminders=[{id:uid(),kind:'pago',name:'Alquiler',amount:23000000,due:next+'-05',done:false,monthly:true}];
  return s;
}

/* Pasa los datos de la versión anterior (ingresos/gastos con estados y asignaciones) a la versión simple */
function migrateOld(o){
  const s = emptyState(); s.sample = !!o.sample;
  const idMap = {'a-colchon':'s-colchon','a-metas':'s-metas','a-otros':'s-otros','a-trading':'i-trading','a-inv-plazo':'i-plazo','a-inv-cafe':'i-cafe','a-reinversion':'i-otra'};
  const oldCats = Array.isArray(o.categories)?o.categories:[];
  const newId = {}; // id viejo -> id nuevo
  for(const c of oldCats){
    if(!c || typeof c.id!=='string' || typeof c.name!=='string') continue;
    const kind = c.kind==='ingreso'?'in':c.kind==='gasto'?'out':c.kind==='asignacion'?(c.invest?'invest':'save'):null;
    if(!kind) continue;
    const target = idMap[c.id] || c.id;
    newId[c.id] = target;
    const limit = c.target && Number.isFinite(c.target.value) ? {mode:c.target.mode==='pct'?'pct':'amount', value:c.target.value} : null;
    const ex = s.categories.find(x=>x.id===target);
    if(ex){ if(c.id!=='a-reinversion') ex.name=c.name.trim().slice(0,60); ex.hidden=!!c.hidden; ex.limit=limit; }
    else s.categories.push({id:target, kind, name:c.name.trim().slice(0,60), hidden:!!c.hidden, limit, areaId:defaultAreaFor({id:target,kind})});
  }
  const catKind = id => s.categories.find(x=>x.id===id)?.kind;
  let moved = 0;
  for(const m of (Array.isArray(o.movements)?o.movements:[])){
    if(!m || !Number.isInteger(m.amount) || m.amount<=0 || !isValidDate(m.date)) continue;
    const desc = [m.desc, m.note].filter(Boolean).join(' — ').slice(0,120);
    const cid = newId[m.categoryId];
    const done = m.status==='completado';
    if(m.type==='ingreso' || m.type==='gasto'){
      if(done) s.movements.push({id:uid(), kind:m.type==='ingreso'?'in':'out', amount:m.amount, date:m.date, categoryId: cid||(m.type==='ingreso'?'in-otros':'g-otros'), desc, entity:'', maturity:'', closed:false});
      else { s.reminders.push({id:uid(), kind:m.type==='ingreso'?'cobro':'pago', name:(m.desc||'Sin nombre').slice(0,80), amount:m.amount, due:m.date, done:false, monthly:false}); moved++; }
    } else if(m.type==='asignacion'){
      const wasInvest = catKind(cid)==='invest';
      if(!done) s.movements.push({id:uid(), kind:'save', amount:m.amount, date:m.date, categoryId: wasInvest?'s-reinvertir':(cid||'s-otros'), desc, entity:'', maturity:'', closed:false});
      else if(wasInvest) s.movements.push({id:uid(), kind:'invest', amount:m.amount, date:m.date, categoryId:cid, desc, entity:String(m.source||'').slice(0,80), maturity:isValidDate(m.maturity)?m.maturity:'', closed:m.invStatus==='finalizada'});
      else s.movements.push({id:uid(), kind:'save', amount:m.amount, date:m.date, categoryId:cid||'s-otros', desc, entity:'', maturity:'', closed:false});
    }
  }
  for(const r of (Array.isArray(o.reminders)?o.reminders:[])){
    if(!r || typeof r.name!=='string' || !Number.isInteger(r.amount) || r.amount<=0 || !isValidDate(r.due)) continue;
    s.reminders.push({id:uid(), kind:'pago', name:r.name.slice(0,80), amount:r.amount, due:r.due, done:r.status==='pagado', monthly:!!r.monthly});
  }
  s.notice = 'La app ahora es más simple: cargás lo que ya pasó con 4 botones (Entró, Gasté, Aparté, Invertí).' + (moved?` ${moved} ${moved===1?'movimiento que estaba pendiente pasó':'movimientos que estaban pendientes pasaron'} a Pagos.`:'');
  return s;
}
function sanitize(s){
  if(!s || typeof s!=='object') return null;
  if(!s.version || s.version<3 || (Array.isArray(s.movements) && s.movements.some(m=>m && m.type))) return Array.isArray(s.movements)?migrateOld(s):null;
  if(!Array.isArray(s.categories) || !Array.isArray(s.movements)) return null;
  const areas = Array.isArray(s.areas) ? s.areas.filter(a=>a && typeof a.id==='string' && typeof a.name==='string' && a.name.trim())
    .map(a=>({id:a.id, name:a.name.trim().slice(0,50), pct: Number.isFinite(a.pct) && a.pct>=0 && a.pct<=100 ? a.pct : null})) : defaultAreas();
  const areaIds = new Set(areas.map(a=>a.id));
  const cats = s.categories.filter(c=>c && typeof c.id==='string' && KINDS[c.kind] && typeof c.name==='string' && c.name.trim())
    .map(c=>({id:c.id, kind:c.kind, name:c.name.trim().slice(0,60), hidden:!!c.hidden,
      limit: c.limit && (c.limit.mode==='amount'||c.limit.mode==='pct') && Number.isFinite(c.limit.value) && c.limit.value>0 ? {mode:c.limit.mode, value:c.limit.value} : null,
      areaId: c.kind==='in' ? null : ('areaId' in c ? (areaIds.has(c.areaId)?c.areaId:null) : (areaIds.has(defaultAreaFor(c))?defaultAreaFor(c):null))}));
  const ids = new Set(cats.map(c=>c.id));
  const movs = s.movements.filter(m=>m && KINDS[m.kind] && Number.isInteger(m.amount) && m.amount>0 && isValidDate(m.date))
    .map(m=>({id:typeof m.id==='string'?m.id:uid(), kind:m.kind, amount:m.amount, date:m.date, categoryId: ids.has(m.categoryId)?m.categoryId:null,
      desc:String(m.desc||'').slice(0,120), entity:String(m.entity||'').slice(0,80), maturity:isValidDate(m.maturity)?m.maturity:'', closed:!!m.closed,
      usd: Number.isInteger(m.usd) && m.usd>0 ? m.usd : null}));
  const rems = (Array.isArray(s.reminders)?s.reminders:[]).filter(r=>r && typeof r.name==='string' && Number.isInteger(r.amount) && r.amount>0 && isValidDate(r.due))
    .map(r=>({id:typeof r.id==='string'?r.id:uid(), kind:r.kind==='cobro'?'cobro':'pago', name:r.name.slice(0,80), amount:r.amount, due:r.due, done:!!r.done, monthly:!!r.monthly}));
  const p = s.plan||{}, fx = s.fx||{};
  const pr = s.profile||{};
  return {version:3, sample:!!s.sample, profile:{name:String(pr.name||'').trim().slice(0,40), from:String(pr.from||'').trim().slice(0,40)}, categories:cats, movements:movs, reminders:rems, notice:typeof s.notice==='string'?s.notice:'', areas,
    plan:{goal: Number.isInteger(p.goal)&&p.goal>0?p.goal:null, cur: p.cur==='ARS'?'ARS':'USD'},
    fx:{rate: Number.isFinite(fx.rate)&&fx.rate>0?fx.rate:null, updatedAt: Number(fx.updatedAt)||0, source: ['auto','manual','oficial'].includes(fx.source)?fx.source:'',
      parts: Array.isArray(fx.parts) ? fx.parts.filter(x=>x && typeof x.name==='string' && Number(x.ask)>0).slice(0,3).map(x=>{ const bid=Number(x.bid)>0?Number(x.bid):Number(x.ask), ask=Number(x.ask); return {name:x.name.slice(0,30), bid, ask, mid:Number(x.mid)>0?Number(x.mid):avg([bid,ask])}; }) : []}};
}
let storageOk = true;
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const s=sanitize(JSON.parse(raw)); if(s) return s; }
    const old = localStorage.getItem(OLD_KEY);   /* la versión anterior queda guardada como respaldo */
    if(old){ const s=sanitize(JSON.parse(old)); if(s) return s; }
  }catch(e){ storageOk=false; }
  return emptyState();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); storageOk=true; }catch(e){ storageOk=false; } }

let state = load();
const ui = { view:'inicio', month:ymOf(todayStr()), day:null, modalKind:null, confirmResolve:null, locked:false, catKind:'out', addDate:null, planTab:'reparto' };

const catName = id => cat(id)?.name || 'Sin categoría';
const catsOf = kind => state.categories.filter(c=>c.kind===kind);

/* ---------- Cálculos ----------
   Entró       = todo lo que entró en el mes
   Disponible  = Entró − Gastaste − Invertiste   (la plata que tenés)
   Libre       = Disponible − Apartaste          (lo que podés usar sin tocar lo apartado)
   % de una categoría = importe / Entró × 100 */
function calc(ym){
  const ms = state.movements.filter(m=>ymOf(m.date)===ym);
  const by = k => ms.filter(m=>m.kind===k);
  const inc=sum(by('in')), out=sum(by('out')), inv=sum(by('invest')), sav=sum(by('save'));
  const byCat = list => { const o={}; for(const m of list){ const k=m.categoryId||'_'; o[k]=(o[k]||0)+m.amount; } return o; };
  return {ms, inc, out, inv, sav, available: inc-out-inv, free: inc-out-inv-sav, outByCat: byCat(by('out')), inByCat: byCat(by('in'))};
}
/* ---------- Dólar de la app ----------
   Para cada billetera (Ualá, Naranja X, Mercado Pago) se toma el punto medio entre
   compra y venta; el dólar de la app es el promedio de esas billeteras (cotizaciones
   públicas de ComparaDólar). Si no se consiguen, respaldo: oficial, punto medio.
   En la app instalada se actualiza solo; dentro de Claude la página no puede salir
   a internet, así que se cargan a mano las tres cotizaciones y la app saca el promedio. */
const usdFmt = new Intl.NumberFormat('es-AR',{style:'currency',currency:'USD',maximumFractionDigits:0});
const usdFmt2 = new Intl.NumberFormat('es-AR',{style:'currency',currency:'USD',maximumFractionDigits:2});
const rate = () => state.fx.rate;
const usd = c => rate() ? usdFmt.format(c/100/rate()) : '';
const goalArs = () => { const p=state.plan; if(!p.goal) return null; if(p.cur==='ARS') return p.goal; return rate() ? Math.round(p.goal*rate()) : null; };
const inFrame = (()=>{ try{ return window.self!==window.top; }catch(e){ return true; } })();
const WALLETS = [['Ualá', /^ual[aá]/i], ['Naranja X', /naranja/i], ['Mercado Pago', /mercado[\s_-]?pago/i]];
async function getJson(url){
  const ctl = new AbortController(); const tm = setTimeout(()=>ctl.abort(), 8000);
  try{ const r = await fetch(url, {signal:ctl.signal, cache:'no-store'}); return r.ok ? await r.json() : null; }
  catch(e){ return null; } finally{ clearTimeout(tm); }
}
const avg = arr => Math.round(arr.reduce((a,x)=>a+x,0)/arr.length*100)/100;
async function fetchFx(){
  const list = await getJson('https://api.comparadolar.ar/usd');
  if(Array.isArray(list)){
    const parts = [];
    for(const [label, re] of WALLETS){
      const found = list.filter(q=>q && Number(q.ask)>0 && [q.slug,q.name,q.prettyName].some(v=>re.test(String(v||''))));
      found.sort((a,b)=>(b.usdType==='Oficial')-(a.usdType==='Oficial'));
      const q = found[0];
      if(q){ const bid=Number(q.bid)>0?Number(q.bid):Number(q.ask); parts.push({name:label, bid, ask:Number(q.ask), mid:avg([bid, Number(q.ask)])}); }
    }
    if(parts.length){ state.fx = {rate:avg(parts.map(p=>p.mid)), updatedAt:Date.now(), source:'auto', parts}; save(); return true; }
  }
  const j = await getJson('https://dolarapi.com/v1/dolares/oficial');
  const v = j && Number(j.venta)>0 ? (Number(j.compra)>0 ? avg([Number(j.compra), Number(j.venta)]) : Number(j.venta)) : 0;
  if(v>0){ state.fx = {rate:v, updatedAt:Date.now(), source:'oficial', parts:[]}; save(); return true; }
  return false;
}
async function autoFx(){ if(inFrame || !navigator.onLine) return; const f=state.fx; const fresh=Date.now()-(f.updatedAt||0) < 6*3600*1000; if(fresh && f.rate && !(f.source==='auto' && !f.parts.length)) return; if(await fetchFx()) render(); }
function limitAmount(c, inc){ if(!c.limit) return null; return c.limit.mode==='amount' ? c.limit.value : (inc>0 ? Math.round(inc*c.limit.value/100) : null); }

function openDay(date){

function vPagos(){
  const pend = state.reminders.filter(r=>!r.done).sort((a,b)=>a.due.localeCompare(b.due));
  const done = state.reminders.filter(r=>r.done).sort((a,b)=>b.due.localeCompare(a.due)).slice(0,20);
  const row = r => `<div class="prow"><button class="mrow" data-rem-edit="${r.id}"><span class="mi"><span class="t">${esc(r.name)}${!r.done&&daysUntil(r.due)<0?'<span class="tag red">Vencido</span>':''}${r.monthly?'<span class="tag grey">Mensual</span>':''}</span><span class="s">${r.done?(r.kind==='cobro'?'Cobrado':'Pagado')+' · '+shortDate(r.due):remWhen(r)}</span></span><span class="ma ${r.kind==='cobro'?'c-in':'c-out'}">${money(r.amount)}</span></button>
    ${r.done?'':`<div class="act"><button class="btn sm primary" data-rem-done="${r.id}">${r.kind==='cobro'?'Ya cobré':'Ya pagué'}</button></div>`}</div>`;
  const pagos = pend.filter(r=>r.kind==='pago'), cobros = pend.filter(r=>r.kind==='cobro');
  return `<section class="card"><div class="card-head"><h2>Tengo que pagar</h2><button class="btn sm primary" data-action="rem-new">+ Agregar</button></div>
      ${pagos.length?`<div class="list">${pagos.map(row).join('')}</div>`:'<div class="empty">No tenés pagos anotados. Agregá alquiler, cuotas, servicios…</div>'}</section>
    <section class="card"><div class="card-head"><h2>Me tienen que pagar</h2><button class="btn sm" data-action="rem-new" data-kind="cobro">+ Agregar</button></div>
      ${cobros.length?`<div class="list">${cobros.map(row).join('')}</div>`:'<div class="empty">Nada por cobrar. Acá podés anotar, por ejemplo, una plata que te deben.</div>'}
      <p class="small muted">Lo que esperás cobrar no suma hasta que tocás “Ya cobré”.</p></section>
    ${done.length?`<details class="card more"><summary>Hechos (${done.length})</summary><div class="list">${done.map(row).join('')}</div></details>`:''}
    <p class="small muted">“Ya pagué” abre el gasto listo para guardar, así queda en tu mes. Los avisos aparecen al abrir la app. Para que el teléfono te avise solo, tocá un pago y elegí “Agregar a Google Calendar”.</p>`;
}

function vPlan(){
  const tab = ui.planTab;
  return `<div class="segbtns" role="group" aria-label="Partes del plan"><button class="chip" aria-pressed="${tab==='reparto'}" data-plantab="reparto">Reparto ideal</button><button class="chip" aria-pressed="${tab==='inversion'}" data-plantab="inversion">Reinversión</button></div>`
    + (tab==='inversion' ? vInversion() : vReparto());
}
function fxCard(){
  const f = state.fx;
  const when = f.updatedAt ? new Date(f.updatedAt).toLocaleString('es-AR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '';
  const names = arr => arr.join(', ').replace(/, ([^,]*)$/,' y $1');
  const how = f.source==='auto' && !f.parts.length ? 'Se actualizó solo' : f.source==='auto' ? `Se actualizó solo` + (f.parts.length<3?` (no encontré ${WALLETS.map(w=>w[0]).filter(n=>!f.parts.some(p=>p.name===n)).join(' ni ')})`:'')
    : f.source==='oficial' ? 'No pude leer las billeteras: uso el oficial (punto medio entre compra y venta) como respaldo'
    : f.source==='manual' ? 'Lo cargaste a mano' : '';
  const val = (n,k) => { const p=f.parts.find(x=>x.name===n); return p ? String(p[k]).replace('.',',') : ''; };
  return `<section class="card"><div class="card-head"><h2>Dólar de la app</h2>${f.rate?`<b class="num" style="font-size:1.25rem">${moneyFmt.format(f.rate)}</b>`:''}</div>
    <p class="small muted">Para cada billetera tomo el punto medio entre compra y venta, y después saco el promedio entre Ualá, Naranja X y Mercado Pago.</p>
    ${f.rate?`<p class="small">${how} · ${when}</p>`:'<p class="small">Todavía no hay valor. Sin él no puedo pasar a dólares.</p>'}
    ${f.parts.length?`<div class="table-wrap"><table class="fx-table"><thead><tr><th>Billetera</th><th class="r">Compra</th><th class="r">Venta</th><th class="r">Promedio</th></tr></thead><tbody>${f.parts.map(p=>`<tr><td>${esc(p.name)}</td><td class="r num">${moneyFmt.format(p.bid)}</td><td class="r num">${moneyFmt.format(p.ask)}</td><td class="r num"><b>${moneyFmt.format(p.mid)}</b></td></tr>`).join('')}</tbody></table></div>`:''}
    <details class="more" ${inFrame&&!f.rate?'open':''}><summary>${inFrame?'Cargar las cotizaciones a mano':'Cargar a mano o actualizar'}</summary>
      <form id="fxForm" class="stack" novalidate>
        <p class="small muted">${inFrame?'Desde acá la app no puede consultar internet. Fijate la compra y la venta en cada app (o en comparadolar.ar). En la app del celular se actualiza sola.':'Si no se pudo actualizar, cargá la compra y la venta de cada una.'}</p>
        ${WALLETS.map(([n],i)=>`<div class="fx-row"><span class="flabel">${n}</span><div class="field"><label for="fxb-${i}">Compra</label><input id="fxb-${i}" inputmode="decimal" value="${esc(val(n,'bid'))}"></div><div class="field"><label for="fxa-${i}">Venta</label><input id="fxa-${i}" inputmode="decimal" value="${esc(val(n,'ask'))}"></div></div>`).join('')}
        <span class="err" id="fxErr"></span>
        <div class="btn-row"><button class="btn primary" type="submit">Guardar promedio</button>${inFrame?'':'<button class="btn" type="button" data-action="fx-refresh">Actualizar ahora</button>'}</div>
      </form></details></section>`;
}
function areaSelect(x){ return `<select class="areasel" data-cat-area="${x.id}" aria-label="Área de ${esc(x.name)}"><option value="">Sin área</option>${state.areas.map(a=>`<option value="${a.id}" ${a.id===x.areaId?'selected':''}>${esc(a.name)}</option>`).join('')}</select>`; }
function vReparto(){
  const c = calc(ui.month), areas = state.areas, p = state.plan, gA = goalArs();
  const total = areas.reduce((a,x)=>a+(x.pct||0),0), rest = Math.round((100-total)*100)/100;
  const realBy = {}; let noArea = 0; const noAreaCats = new Set();
  for(const m of c.ms){
    if(m.kind==='in') continue;
    const ct = cat(m.categoryId), a = ct && ct.areaId;
    if(a && areas.some(x=>x.id===a)) realBy[a]=(realBy[a]||0)+m.amount; else { noArea+=m.amount; noAreaCats.add(ct?ct.name:'Sin categoría'); }
  }
  const sel = 'padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px';
  let h = `<section class="card"><h2>Tu meta de ingreso por mes</h2>
    <form id="goalForm" class="inline-new" novalidate><input id="goal-amt" inputmode="decimal" placeholder="Ej.: 10.000" value="${p.goal?amountToInput(p.goal):''}" aria-label="Meta mensual"><select id="goal-cur" aria-label="Moneda" style="${sel}"><option value="USD" ${p.cur==='USD'?'selected':''}>US$</option><option value="ARS" ${p.cur==='ARS'?'selected':''}>$</option></select><button class="btn primary" type="submit">Guardar</button></form><span class="err" id="goalErr"></span>
    ${p.goal ? `<p class="small">${p.cur==='USD' ? `${usdFmt.format(p.goal/100)} ${gA?`son ${money(gA)} al dólar de hoy.`:'— cargá el dólar para pasarlo a pesos.'}` : `${money(p.goal)}${rate()?` son ${usd(p.goal)}.`:'.'}`}</p>
      ${gA?`<div class="track" style="height:10px"><span class="fill ideal" style="display:block;width:${Math.min(100,c.inc/gA*100).toFixed(1)}%"></span></div><p class="small muted">En ${esc(monthName(ui.month).split(' ')[0].toLowerCase())} entraron ${money(c.inc)}${rate()?` (${usd(c.inc)})`:''}: el ${pctNum(c.inc/gA*100)} de tu meta.</p>`:''}`
      : '<p class="small muted">Por ejemplo US$ 10.000. Con la meta te muestro cuánto le tocaría a cada área.</p>'}
  </section>`;
  h += fxCard();
  h += `<section class="card"><div class="card-head"><h2>Tu reparto ideal</h2>${total?`<span class="small ${rest<0?'c-out':'muted'}">Total ${pctNum(total)}</span>`:''}</div>
    <p class="small muted">¿Qué porcentaje de lo que entra querés para cada área? Lo decidís vos; no hay un reparto “correcto”.</p>
    <div>${areas.map(a=>`<div class="cat-edit"><input id="an-${a.id}" value="${esc(a.name)}" data-area-name="${a.id}" aria-label="Nombre del área" maxlength="50"><span class="pctbox"><input id="ap-${a.id}" inputmode="decimal" value="${a.pct!=null?String(a.pct).replace('.',','):''}" placeholder="—" data-area-pct="${a.id}" aria-label="Porcentaje para ${esc(a.name)}">%</span><button id="ad-${a.id}" class="btn sm danger" data-action="del-area" data-id="${a.id}" aria-label="Borrar el área ${esc(a.name)}">✕</button></div>`).join('')}</div>
    <form id="areaForm" class="inline-new" novalidate><input id="area-new" maxlength="50" placeholder="Nueva área (ej.: Viajes)" aria-label="Nueva área"><button class="btn" type="submit">Agregar</button></form>
    <p class="small ${rest<0?'c-out':'muted'}">${total===0?'Todavía no cargaste porcentajes.':rest>0?`Te queda ${pctNum(rest)} sin repartir: cuenta como libre.`:rest<0?`Te pasaste ${pctNum(-rest)}: el total tiene que dar 100%.`:'Repartiste el 100%.'}</p>
  </section>`;
  const col = (label, val, sub) => `<div><span class="label">${label}</span><b class="num">${val}</b>${sub?`<span class="small muted">${sub}</span>`:''}</div>`;
  const block = (name, pct, real) => {
    const ideal = pct!=null && c.inc>0 ? Math.round(c.inc*pct/100) : null;
    const atGoal = pct!=null && gA ? Math.round(gA*pct/100) : null;
    const d = ideal!=null ? real-ideal : 0;
    return `<div class="area-cmp"><div class="line"><b>${esc(name)}</b><span class="tag ${pct!=null?'inv':'grey'}">${pct!=null?'Ideal '+pctNum(pct):'Sin %'}</span></div>
      <div class="cols">${col('Real', money(real), pctOf(real,c.inc)+(rate()?' · '+usd(real):''))}${col('Ideal hoy', ideal!=null?money(ideal):'—', ideal!=null&&rate()?usd(ideal):'')}${col('Con tu meta', atGoal!=null?money(atGoal):'—', atGoal!=null&&rate()?usd(atGoal):'')}</div>
      ${ideal!=null&&ideal>0?`<div class="track"><span class="fill ideal" style="display:block;width:${Math.min(100,real/ideal*100).toFixed(1)}%"></span></div><span class="small muted">${d>0?`${money(d)} por encima de tu ideal`:d<0?`${money(-d)} por debajo de tu ideal`:'Justo en tu ideal'}</span>`:''}</div>`;
  };
  h += `<section class="card"><div class="card-head"><h2>Ideal vs. real</h2><span class="small muted">Entró ${money(c.inc)} en ${esc(monthName(ui.month).split(' ')[0].toLowerCase())}</span></div>
    <p class="small muted"><b>Real</b>: lo que usaste este mes. <b>Ideal hoy</b>: lo que le tocaría con lo que entró. <b>Con tu meta</b>: lo que le tocaría si ganaras tu meta.</p>
    ${c.inc<=0?'<p class="small">Cuando cargues lo que entró este mes, te calculo el ideal de cada área.</p>':''}
    <div class="list">${areas.map(a=>block(a.name, a.pct, realBy[a.id]||0)).join('')}
      ${noArea?`<div class="area-cmp"><div class="line"><b>Sin área</b><b class="num">${money(noArea)}</b></div><span class="small muted">${esc([...noAreaCats].join(', '))}. Elegí su área en “Qué categoría va en cada área”.</span></div>`:''}
      ${block('Libre', rest>0&&total>0?rest:(total>0?0:null), Math.max(c.free,0))}
    </div></section>`;
  const assignable = state.categories.filter(x=>x.kind!=='in' && !x.hidden);
  h += `<details class="card more"><summary>Qué categoría va en cada área</summary>
    ${['out','save','invest'].map(k=>`<h3 style="margin:8px 0 2px">${KINDS[k].group}</h3><div>${assignable.filter(x=>x.kind===k).map(x=>`<div class="cat-edit"><span style="flex:1 1 140px;min-width:0">${esc(x.name)}</span>${areaSelect(x)}</div>`).join('')}</div>`).join('')}
  </details>`;
  return h;
}

function vInversion(){
  const c = calc(ui.month);
  const inv = state.movements.filter(m=>m.kind==='invest');
  const active = inv.filter(m=>!m.closed).sort((a,b)=>b.date.localeCompare(a.date));
  const closed = inv.filter(m=>m.closed).sort((a,b)=>b.date.localeCompare(a.date));
  const saves = c.ms.filter(m=>m.kind==='save');
  const types = catsOf('invest').map(t=>({t, month:sum(c.ms.filter(m=>m.kind==='invest'&&m.categoryId===t.id)), act:sum(active.filter(m=>m.categoryId===t.id)), n:active.filter(m=>m.categoryId===t.id).length})).filter(o=>!o.t.hidden||o.act||o.month);
  return `<div class="notice risk"><span class="grow"><strong>Toda inversión tiene riesgo:</strong> el trading, las criptomonedas y las acciones pueden perder valor. Acá solo anotás lo que decidís: la app no calcula ganancias ni te dice cuánto invertir.</span></div>
    <div class="tri">
      <div class="mini"><span class="label">Apartado</span><span class="v">${money(c.sav)}</span><span class="small muted">este mes</span></div>
      <div class="mini"><span class="label">Invertido</span><span class="v c-inv">${money(c.inv)}</span><span class="small muted">este mes</span></div>
      <div class="mini"><span class="label">Activo</span><span class="v">${money(sum(active))}</span><span class="small muted">en total</span></div></div>
    <div class="btn-row"><button class="btn primary" data-action="add-kind" data-kind="invest">+ Invertí</button><button class="btn" data-action="add-kind" data-kind="save">+ Aparté</button></div>
    <section class="card"><div class="card-head"><h2>Por tipo</h2><button class="link-btn" data-action="cats" data-kind="invest">Crear o editar tipos</button></div>
      <div class="list">${types.map(o=>`<div class="mrow" style="cursor:default"><span class="mi"><span class="t">${esc(o.t.name)}</span><span class="s">Este mes ${money(o.month)}</span></span><span class="ma">${money(o.act)}<span class="small muted" style="display:block;font-weight:500">${o.n?`${o.n} activa${o.n>1?'s':''}`:'sin activas'}</span></span></div>`).join('')}</div></section>
    <section class="card"><h2>Lo que apartaste este mes</h2>
      ${saves.length?`<div class="list">${saves.map(mrow).join('')}</div><p class="small muted">Cuando uses esta plata para invertir, cargá “Invertí” y elegí “Sale de lo apartado”: así no se cuenta dos veces.</p>`:'<div class="empty">No apartaste plata este mes.</div>'}</section>
    <section class="card"><h2>Inversiones activas</h2>
      ${active.length?`<div class="list">${active.map(mrow).join('')}</div>`:'<div class="empty">No tenés inversiones activas anotadas.</div>'}
      ${closed.length?`<details class="more"><summary>Finalizadas (${closed.length})</summary><div class="list">${closed.map(mrow).join('')}</div></details>`:''}
      <p class="small muted">Si recuperás plata (vence un plazo fijo, hacés un retiro), cargala en “Entró plata → Rendimientos de inversiones” y marcá la inversión como finalizada.</p></section>`;
}

function vGuia(){
  const ex = {inc:30000000,out:23000000,inv:0,sav:7000000,available:7000000,free:0};
  return `<article class="guide stack">
    <section class="card"><h2>Cómo funciona Libro de Caja</h2>
      <p><b>La idea en una frase:</b> anotás lo que entra y lo que sale, y la app te dice cuánto te queda libre.</p>
      <p class="muted">Todo lo que cargás ya pasó. Lo que todavía no pasó (un pago que vence, una plata que esperás cobrar) va en <b>Pagos</b>.</p></section>
    <section class="card"><h3>1. Los cuatro botones</h3>
      <p>Tocás <b>+ Cargar</b> y elegís uno:</p>
      <div class="tiles">
        <div class="tile t-in"><b>Entró plata</b><span>Tu sueldo, una venta, un cobro.</span></div>
        <div class="tile t-out"><b>Gasté</b><span>Algo que pagaste: alquiler, comida, servicios.</span></div>
        <div class="tile t-save"><b>Aparté</b><span>Plata que separás para algo (reinvertir, colchón) pero todavía es tuya y no la usaste.</span></div>
        <div class="tile t-inv"><b>Invertí</b><span>Plata que ya pusiste en algo: un plazo fijo, acciones, un emprendimiento.</span></div>
      </div>
      <p>Después ponés el importe, tocás una categoría y listo. La fecha arranca en hoy.</p></section>
    <section class="card"><h3>2. Cómo se calcula (con tu ejemplo)</h3>
      <p>Por ejemplo: entraron $300.000, gastaste $230.000 en alquiler y gastos del mes, y apartaste los $70.000 que sobraron para ahorrar:</p>
      ${formula(ex)}
      <p><b>Disponible</b> es la plata que tenés. <b>Libre</b> es la que podés usar sin tocar lo que apartaste. Los porcentajes se calculan sobre lo que entró: en el ejemplo, los gastos son el 76,67% y lo que sobró el 23,33%.</p></section>
    <section class="card"><h3>3. Aparté vs. Invertí</h3>
      <ul><li><b>Aparté</b>: la plata sigue con vos, solo la separaste. No baja tu “Disponible”, sí baja tu “Libre”.</li>
      <li><b>Invertí</b>: la plata salió hacia una inversión. Baja tu “Disponible”.</li>
      <li>Si invertís plata que habías apartado, al cargar “Invertí” elegí <b>“Sale de lo apartado”</b>. La app achica lo apartado y la plata se cuenta una sola vez.</li></ul></section>
    <section class="card"><h3>4. Tu día a día</h3>
      <ol><li><b>Cuando cobrás:</b> + Cargar → Entró plata.</li>
      <li><b>Cuando pagás algo:</b> + Cargar → Gasté. Tarda 10 segundos.</li>
      <li><b>Cuando cobrás y separás para reinvertir:</b> + Cargar → Aparté → “Para reinvertir”.</li>
      <li><b>Cuando invertís:</b> + Cargar → Invertí, elegís el tipo (plazo fijo, acciones, emprendimiento…).</li>
      <li><b>Una vez por mes:</b> mirá Inicio, revisá en qué gastaste y ajustá tus topes si querés.</li></ol></section>
    <section class="card"><h3>5. Las pantallas</h3>
      <div class="screens">
        <div><b>Inicio</b>Cuánto te queda libre, a dónde fue tu plata, en qué gastaste y lo que vence pronto.</div>
        <div><b>Mes</b>El calendario: tocás un día y ves qué pasó. Abajo, todo el mes día por día.</div>
        <div><b>Pagos</b>Lo que tenés que pagar y lo que te tienen que pagar, con fecha. “Ya pagué” lo carga como gasto.</div>
        <div><b>Plan</b>Tu reparto ideal en porcentajes, tu meta en dólares o pesos, y la reinversión.</div>
        <div><b>Ajustes ⚙</b>Colores de la app, categorías, PIN y copia de seguridad.</div>
      </div></section>
    <section class="card"><h3>6. Tu plan ideal y los dólares</h3>
      <ol><li><b>Repartí en porcentajes:</b> en Plan → Reparto ideal, poné cuánto querés para cada área. Por ejemplo, Ahorro 10%. Lo que no repartas queda como libre.</li>
      <li><b>Cada categoría cae en un área:</b> Vivienda y Servicios van a Gastos fijos, Comida a Gastos del día a día, y así. Lo cambiás en “Qué categoría va en cada área”.</li>
      <li><b>Poné tu meta:</b> por ejemplo US$ 10.000 por mes. La app la pasa a pesos al dólar de hoy.</li>
      <li><b>Mirá la comparación:</b> para cada área ves <b>Real</b> (lo que usaste), <b>Ideal hoy</b> (lo que le tocaría con lo que entró) y <b>Con tu meta</b> (lo que le tocaría si ganaras tu meta), en pesos y en dólares.</li>
      <li><b>El dólar:</b> para Ualá, Naranja X y Mercado Pago se toma el punto medio entre compra y venta (si compra 1.400 y vende 1.500, es 1.450), y después el promedio entre las tres. En la app del celular se actualiza solo; dentro de Claude cargás la compra y la venta a mano en Plan y la app saca el promedio. Al cargar un movimiento podés elegir US$ y se guarda en pesos al dólar de ese día.</li></ol></section>
    <section class="card"><h3>7. Preguntas rápidas</h3>
      <ul><li><b>¿Me equivoqué al cargar?</b> Tocá el movimiento: lo podés corregir o borrar.</li>
      <li><b>¿Cómo creo una categoría?</b> Al cargar, tocá “+ Nueva” entre las categorías. O en Ajustes → Categorías.</li>
      <li><b>¿Cómo pongo un límite de gasto?</b> En Inicio, tocá la categoría en “En qué gastaste” y escribí un monto (150000) o un porcentaje (30%). Pasarte no está “mal”: es un dato para decidir.</li>
      <li><b>¿Quién ve mis datos?</b> Nadie más. Viven solo en tu teléfono. Activá el PIN en Ajustes si querés más privacidad, y exportá una copia cada tanto.</li>
      <li><b>¿Y el mes que viene?</b> Cambiás de mes con las flechas. Los pagos mensuales se renuevan solos cuando tocás “Ya pagué”.</li></ul></section>
    <div class="btn-row"><button class="btn primary" data-go="inicio">Ir a Inicio</button>${state.movements.length?'':'<button class="btn" data-action="load-sample">Probar con un ejemplo</button>'}</div>
  </article>`;
}

/* ---------- Hojas (modales) ---------- */
function openModal(html, onMount, kind='form'){
  ui.modalKind = kind;
  $('#modalRoot').innerHTML = `<div class="overlay" data-overlay><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  if(onMount) onMount($('#modalRoot'));
  const f = $('#modalRoot [autofocus]') || $('#modalRoot .sheet button');
  setTimeout(()=>f && f.focus({preventScroll:true}), 30);
}
function closeModal(){ $('#modalRoot').innerHTML=''; ui.modalKind=null; }
function dismissModal(){
  if(ui.confirmResolve){ const r=ui.confirmResolve; ui.confirmResolve=null; closeModal(); r(false); if(ui.day) openDay(ui.day); return; }
  const k=ui.modalKind; closeModal();
  if(k==='day') ui.day=null; else if(ui.day) openDay(ui.day);
}
function askConfirm(message, okLabel='Confirmar'){
  return new Promise(resolve=>{
    ui.confirmResolve = resolve;
    openModal(`<h2>¿Seguro?</h2><p>${message}</p><div class="btn-row" style="justify-content:flex-end"><button class="btn" data-c="no">Cancelar</button><button class="btn danger" data-c="yes">${esc(okLabel)}</button></div>`,
      root=>root.querySelectorAll('[data-c]').forEach(b=>b.addEventListener('click',()=>{ if(b.dataset.c==='yes'){ ui.confirmResolve=null; closeModal(); resolve(true); } else dismissModal(); })), 'confirm');
  });
}
let toastTimer;
function toast(msg){ const r=$('#toastRoot'); r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toastTimer); toastTimer=setTimeout(()=>r.innerHTML='',3000); }

function chooseKind(date){
  ui.addDate = date || (ui.day||null);
  openModal(`<div class="sheet-head"><h2>¿Qué querés cargar?</h2><button class="icon-btn" data-close aria-label="Cerrar">✕</button></div>
    <div class="tiles">${[['in','t-in'],['out','t-out'],['save','t-save'],['invest','t-inv']].map(([k,c])=>`<button class="tile ${c}" data-pick="${k}"><b>${KINDS[k].tile}</b><span>${KINDS[k].hint}</span></button>`).join('')}</div>
    <button class="link-btn" data-go="guia" style="align-self:center">¿Cuál elijo? Ver la guía</button>`, null, 'chooser');
}
function lastCatOf(kind){ const m=[...state.movements].reverse().find(x=>x.kind===kind && cat(x.categoryId) && !cat(x.categoryId).hidden); return m?m.categoryId:(catsOf(kind).find(x=>!x.hidden)?.id||''); }
function catChips(kind, selected){
  return catsOf(kind).filter(x=>!x.hidden||x.id===selected).map(x=>`<label class="chip"><input type="radio" name="mcat" value="${x.id}" ${x.id===selected?'checked':''}>${esc(x.name)}</label>`).join('') + `<button type="button" class="chip add" data-newcat>+ Nueva</button>`;
}
function movementForm(m, extra={}){
  const isNew = !m;

  const date0 = m ? m.date : (extra.date || ui.day || (ui.month===ymOf(todayStr())?todayStr():ui.month+'-01'));
  const sel0 = m ? m.categoryId : (extra.categoryId || lastCatOf(kind0));
  const saves = () => state.movements.filter(x=>x.kind==='save' && (!m || x.id!==m.id));
  openModal(`<div class="sheet-head"><h2 id="mf-title">${isNew?KINDS[kind0].title:'Editar'}</h2><button class="icon-btn" data-close aria-label="Cerrar">✕</button></div>
  <form id="movForm" class="stack" novalidate>
    <div class="seg4" role="radiogroup" aria-label="Tipo">${KIND_ORDER.map(k=>`<label><input type="radio" name="mkind" value="${k}" ${k===kind0?'checked':''}>${KINDS[k].short}</label>`).join('')}</div>

    <div class="field"><span class="flabel">Categoría</span><div class="chips" id="catChips">${catChips(kind0, sel0)}</div>
      <div class="inline-new" id="newCatRow" hidden><input id="newCatName" maxlength="60" placeholder="Nombre de la categoría"><button type="button" class="btn primary" data-createcat>Crear</button></div><span class="err" data-err="cat"></span></div>
    <div class="field"><label for="m-date">Fecha</label><div class="btn-row"><button type="button" class="chip" data-setdate="${todayStr()}">Hoy</button><button type="button" class="chip" data-setdate="${yesterdayStr()}">Ayer</button><input id="m-date" type="date" value="${date0}" style="flex:1;min-width:150px;width:auto"></div><span class="err" data-err="date"></span></div>
    <div class="field"><label for="m-desc" id="m-desc-label">${KINDS[kind0].descLabel}</label><input id="m-desc" maxlength="120" value="${esc(m?m.desc:(extra.desc||''))}"></div>
    <div id="invExtra" class="stack" ${kind0==='invest'?'':'hidden'}>
      ${isNew?`<div class="field" id="fromSaveWrap"><label for="m-from">¿Sale de lo apartado?</label><select id="m-from"><option value="">No, sale de plata libre</option></select><span class="hint">Si elegís uno, lo apartado se achica para no contar dos veces.</span></div>`:''}
      <details class="more" ${m&&(m.entity||m.maturity)?'open':''}><summary>Más datos (opcional)</summary><div class="stack">
        <div class="field"><label for="m-entity">Dónde (banco, billetera, broker, emprendimiento…)</label><input id="m-entity" maxlength="80" value="${esc(m?m.entity:'')}"></div>
        <div class="field"><label for="m-maturity">Vence o termina</label><input id="m-maturity" type="date" value="${m?m.maturity:''}"></div></div></details>
      ${!isNew?`<label class="check"><input type="checkbox" id="m-closed" ${m.closed?'checked':''}> Ya terminó (finalizada)</label>`:''}
    </div>
    <button type="submit" class="btn primary block">${isNew?'Guardar':'Guardar cambios'}</button>
    ${!isNew?`<button type="button" class="btn danger block" data-del="${m.id}">Borrar este movimiento</button>`:''}
  </form>`, root=>{
    const form = root.querySelector('#movForm');
    const curKind = () => form.querySelector('input[name=mkind]:checked').value;
    const fillFrom = () => {
      const sel = form.querySelector('#m-from'); if(!sel) return;
      const ym = ymOf(form.querySelector('#m-date').value||todayStr());
      const list = saves().filter(x=>ymOf(x.date)===ym);
      sel.innerHTML = '<option value="">No, sale de plata libre</option>' + list.map(x=>`<option value="${x.id}">${esc(x.desc||catName(x.categoryId))} (${money(x.amount)})</option>`).join('');
      if(list.length===1) sel.value = list[0].id;
      form.querySelector('#fromSaveWrap').hidden = !list.length;
    };
    fillFrom();
    const curOf = () => form.querySelector('input[name=mcur]:checked').value;
    const conv = () => {
      const v = parseAmount(form.querySelector('#m-amount').value), h = form.querySelector('#m-conv');
      if(curOf()==='USD') h.textContent = !rate() ? 'Para cargar en dólares, primero guardá el valor del dólar en Plan.' : (v>0 ? `= ${money(Math.round(v*rate()))} al dólar de hoy (${moneyFmt.format(rate())})` : `Se pasa a pesos al dólar de hoy (${moneyFmt.format(rate())}).`);
      else h.textContent = rate() && v>0 ? `≈ ${usd(v)}` : '';
    };
    form.querySelector('#m-amount').addEventListener('input', conv);
    form.querySelectorAll('input[name=mcur]').forEach(r=>r.addEventListener('change', conv)); conv();
    form.querySelectorAll('input[name=mkind]').forEach(r=>r.addEventListener('change',()=>{
      const k=curKind();
      form.querySelector('#catChips').innerHTML = catChips(k, lastCatOf(k));
      form.querySelector('#m-desc-label').textContent = KINDS[k].descLabel;
      form.querySelector('#invExtra').hidden = k!=='invest';
      if(isNew) root.querySelector('#mf-title').textContent = KINDS[k].title;
    }));
    form.querySelector('#m-date').addEventListener('change', fillFrom);
    form.addEventListener('click', e=>{
      const d = e.target.closest('[data-setdate]'); if(d){ form.querySelector('#m-date').value=d.dataset.setdate; fillFrom(); return; }
      if(e.target.closest('[data-newcat]')){ const row=form.querySelector('#newCatRow'); row.hidden=!row.hidden; if(!row.hidden) form.querySelector('#newCatName').focus(); return; }
      if(e.target.closest('[data-createcat]')){
        const k=curKind(), name=form.querySelector('#newCatName').value.trim(), er=form.querySelector('[data-err=cat]');
        er.textContent='';
        if(!name){ er.textContent='Escribí un nombre.'; return; }
        const dup = catsOf(k).find(x=>x.name.toLowerCase()===name.toLowerCase());
        const id = dup ? dup.id : 'c-'+uid();
        if(!dup){ state.categories.push({id, kind:k, name:name.slice(0,60), hidden:false, limit:null, areaId:defaultAreaFor({id,kind:k})}); save(); }
        else dup.hidden=false;
        form.querySelector('#catChips').innerHTML = catChips(k, id);
        form.querySelector('#newCatRow').hidden = true; form.querySelector('#newCatName').value='';
        toast(dup?'Ya existía, la elegí':'Categoría creada');
      }
    });
    form.querySelector('#newCatName').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); form.querySelector('[data-createcat]').click(); } });
    form.addEventListener('submit', e=>{
      e.preventDefault(); form.querySelectorAll('[data-err]').forEach(x=>x.textContent='');
      const k=curKind(), typed=parseAmount(form.querySelector('#m-amount').value), date=form.querySelector('#m-date').value;
      const inUsd = curOf()==='USD';
      const categoryId = form.querySelector('input[name=mcat]:checked')?.value;
      let ok=true; const err=(f,t)=>{ form.querySelector(`[data-err="${f}"]`).textContent=t; ok=false; };
      if(!Number.isFinite(typed)) err('amount','Escribí un número, por ejemplo 15000 o 15.000,50.');
      else if(typed<=0) err('amount','Tiene que ser mayor que cero.');
      else if(inUsd && !rate()) err('amount','Primero guardá el valor del dólar en Plan.');
      /* En dólares: se guarda en pesos al dólar de hoy. Si editás sin cambiar los dólares, se mantiene el cambio original. */
      const amount = !inUsd ? typed : (m && m.usd===typed ? m.amount : Math.round(typed*(rate()||0)));
      if(!categoryId) err('cat','Tocá una categoría (o creá una con “+ Nueva”).');
      if(!isValidDate(date)) err('date','Elegí una fecha válida.');
      if(!ok) return;
      const data = {kind:k, amount, date, categoryId, desc:form.querySelector('#m-desc').value.trim(),
        entity: k==='invest'?form.querySelector('#m-entity').value.trim():'', maturity: k==='invest'&&isValidDate(form.querySelector('#m-maturity').value)?form.querySelector('#m-maturity').value:'',
        closed: k==='invest' && !!form.querySelector('#m-closed')?.checked, usd: inUsd ? typed : null};
      let msg = isNew?'Guardado':'Cambios guardados';
      if(isNew){
        const fromId = k==='invest' ? form.querySelector('#m-from')?.value : '';
        if(fromId){ const s=state.movements.find(x=>x.id===fromId); if(s){ const used=Math.min(amount,s.amount); s.amount-=used; if(s.amount<=0){ state.movements=state.movements.filter(x=>x.id!==s.id); msg='Guardado. Usaste todo lo apartado.'; } else msg=`Guardado. Quedan ${money(s.amount)} apartados.`; } }
        state.movements.push({id:uid(), ...data});
      } else Object.assign(state.movements.find(x=>x.id===m.id)||{}, data);
      if(extra.reminderId){ const r=state.reminders.find(x=>x.id===extra.reminderId); if(r) markDone(r); }
      save(); closeModal(); if(!ui.day) ui.month=ymOf(date); refresh(); toast(msg);
    });
    const del = form.querySelector('[data-del]');
    if(del) del.addEventListener('click', async ()=>{
      if(await askConfirm(`Se borra “${esc(m.desc||catName(m.categoryId))}” por ${money(m.amount)}.`,'Borrar')){ state.movements=state.movements.filter(x=>x.id!==m.id); save(); refresh(); toast('Borrado'); }
    });
  });
}

  </form>`, root=>{

      if(!isValidDate(due)) err('due','Elegí una fecha válida.');
      if(!ok) return;
      const data={kind:form.querySelector('input[name=rkind]:checked').value, name, amount, due, monthly:form.querySelector('#r-monthly').checked, done: !!form.querySelector('#r-done')?.checked};

function markDone(r){
  r.done = true;
  if(r.monthly){
    const [y,m,d]=r.due.split('-'); const nym=addMonths(y+'-'+m,1); const nd=nym+'-'+pad(Math.min(+d,daysInMonth(nym)));
    if(!state.reminders.some(x=>x.name===r.name && x.due===nd)) state.reminders.push({id:uid(), kind:r.kind, name:r.name, amount:r.amount, due:nd, done:false, monthly:true});
  }
}
function limitForm(id){
  const c=cat(id); if(!c) return;
  const cur = c.limit ? (c.limit.mode==='pct' ? c.limit.value.toLocaleString('es-AR')+'%' : amountToInput(c.limit.value)) : '';
  openModal(`<div class="sheet-head"><h2>Tope para ${esc(c.name)}</h2><button class="icon-btn" data-close aria-label="Cerrar">✕</button></div>
    <p class="muted">¿Cuánto querés gastar como máximo por mes en esta categoría? Escribí un monto (150000) o un porcentaje de lo que entra (30%).</p>
    <form id="limForm" class="stack" novalidate><div class="field"><label for="lim">Tope mensual</label><input id="lim" class="big" inputmode="decimal" value="${esc(cur)}" placeholder="Sin tope" autofocus><span class="err" id="limErr"></span></div>
    <button class="btn primary block" type="submit">Guardar</button>${c.limit?'<button type="button" class="btn block" data-nolimit>Quitar tope</button>':''}</form>`, root=>{
    const f=root.querySelector('#limForm');
    f.addEventListener('submit', e=>{ e.preventDefault(); const raw=f.querySelector('#lim').value.trim();
      if(!raw){ c.limit=null; }
      else if(raw.endsWith('%')){ const v=parseFloat(raw.slice(0,-1).replace(',','.')); if(!(v>0&&v<=1000)){ f.querySelector('#limErr').textContent='Porcentaje inválido.'; return; } c.limit={mode:'pct',value:v}; }
      else { const v=parseAmount(raw); if(!(v>0)){ f.querySelector('#limErr').textContent='Escribí un monto o un porcentaje, por ejemplo 150000 o 30%.'; return; } c.limit={mode:'amount',value:v}; }
      save(); closeModal(); render(); toast(c.limit?'Tope guardado':'Tope quitado'); });
    const nl=f.querySelector('[data-nolimit]'); if(nl) nl.addEventListener('click',()=>{ c.limit=null; save(); closeModal(); render(); toast('Tope quitado'); });
  });
}

/* ---------- PIN ---------- */
const pinSupported = !!(window.crypto && crypto.subtle && window.TextEncoder);
function getPin(){ try{ const p=JSON.parse(localStorage.getItem(PIN_KEY)||'null'); return p&&p.hash&&p.salt?p:null; }catch(e){ return null; } }
async function hashPin(pin, salt){ const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt+':'+pin)); return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join(''); }
let wrongTries=0, hiddenAt=0;
function showLock(){
  ui.locked=true; closeModal(); render();
  const el=$('#lock'); el.hidden=false;
  el.innerHTML=`<form class="lock-box" id="unlockForm" novalidate><div class="brand-mark" style="margin:0 auto;background:var(--brand-ink);color:var(--brand)" aria-hidden="true">$</div><h2>Libro de Caja</h2>
    <label for="unlockPin" style="opacity:.85">Ingresá tu PIN</label><input id="unlockPin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8" placeholder="PIN">
    <div class="err" id="unlockErr"></div><button type="submit">Entrar</button><button type="button" class="link" data-action="pin-forgot">Olvidé mi PIN</button></form>`;
  setTimeout(()=>{ const i=$('#unlockPin'); i&&i.focus(); },30);
}
function hideLock(){ ui.locked=false; const el=$('#lock'); el.hidden=true; el.innerHTML=''; render(); }
document.addEventListener('visibilitychange',()=>{ if(document.hidden) hiddenAt=Date.now(); else if(getPin() && !ui.locked && hiddenAt && Date.now()-hiddenAt>60000) showLock(); });

/* ---------- Exportar / importar ---------- */
let downloadsCap;
async function offerFile(filename, text, mime){
  let delivered=false;
  try{ if(downloadsCap===undefined) downloadsCap=(window.claude && typeof window.claude.use==='function') ? await window.claude.use('downloads') : null; }catch(e){ downloadsCap=null; }
  if(downloadsCap){ try{ await downloadsCap.save({filename, data:text}); delivered=true; toast('Archivo guardado'); }catch(e){ if(e&&e.code==='declined'){ delivered=true; toast('Descarga cancelada'); } } }
  else { try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:mime})); a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),3000); delivered=true; }catch(e){} }
  const out=$('#exportOut');
  if(out){ out.innerHTML=`<div class="field"><label for="exportText">${esc(filename)}</label><textarea class="export" id="exportText" readonly></textarea><span class="hint">${delivered?'También podés copiarlo:':'Si no se descargó, copiá el texto y guardalo.'}</span><button class="btn sm" data-action="copy-export" style="align-self:flex-start">Copiar</button></div>`; $('#exportText').value=text; }
}
function csvCell(v){ const s=String(v??''); return /[;"\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
function toCSV(){
  const head=['Fecha','Tipo','Categoría','Detalle','Dónde','Vence','Importe (ARS)'];
  const rows=[...state.movements].sort((a,b)=>a.date.localeCompare(b.date)).map(m=>{const [y,mo,d]=m.date.split('-'); return [d+'/'+mo+'/'+y,KINDS[m.kind].short,catName(m.categoryId),m.desc,m.entity,m.maturity,(m.amount/100).toFixed(2).replace('.',',')].map(csvCell).join(';');});
  return '﻿'+[head.join(';'),...rows].join('\r\n');
}
async function importText(text){
  let p; try{ p=JSON.parse(text); }catch(e){ toast('El archivo no es una copia válida.'); return; }
  const s=sanitize(p); if(!s){ toast('El archivo no es una copia de esta app.'); return; }
  if(await askConfirm(`Se reemplazan tus datos por la copia (${s.movements.length} movimientos, ${s.reminders.length} pagos y cobros).`,'Reemplazar')){ state=s; save(); render(); toast('Copia importada'); }
}

let deferredInstall=null;
